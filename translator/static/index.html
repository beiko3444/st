<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KR 즉시 번역기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%232f6fb2%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22%3E%E6%96%87%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>텍스트 · 이미지 → EN · 简体中文</strong>
      <span>붙여넣으면 바로 번역</span>
    </div>
    <div class="account" id="account" aria-live="polite">확인 중…</div>
  </header>

  <main class="workspace">
    <section class="pane source-pane">
      <div class="pane-head">
        <span class="pane-title">원문 · 이미지</span>
        <div class="controls">
          <label class="field">
            <span>스타일</span>
            <select id="style">
              <option value="auto">자동 (Jev)</option>
            </select>
          </label>
          <label class="toggle"><input type="checkbox" id="live" checked> 입력 중 자동 번역</label>
        </div>
      </div>
      <div class="lang-bar">
        <span class="lang-bar-title">번역 언어</span>
        <div class="langs" id="langs" role="group" aria-label="번역할 언어"></div>
        <span class="muted" id="lang-hint" hidden>최소 한 언어는 선택해야 합니다</span>
      </div>
      <div class="image-tools">
        <button type="button" id="choose-image">이미지 선택</button>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <span class="muted">이미지도 Ctrl/⌘+V로 붙여넣을 수 있어요</span>
      </div>
      <div class="image-preview" id="image-preview" hidden>
        <div class="image-preview-head"><span id="image-name"></span><button type="button" id="remove-image">이미지 삭제</button></div>
        <img id="source-image" alt="번역할 이미지 미리보기">
      </div>
      <p id="image-message" class="image-message" role="status" hidden></p>
      <textarea id="source" aria-label="번역할 원문" spellcheck="false" autofocus
        placeholder="한국어 또는 이미지를 붙여넣으세요 (Ctrl/⌘+V) — 체크한 언어로 바로 번역됩니다.&#10;직접 입력하면 잠시 멈췄을 때 번역합니다. Ctrl/⌘+Enter: 즉시 번역"></textarea>
      <div class="pane-foot">
        <span class="chip" id="jev-chip" hidden></span>
        <span class="chip muted" id="style-chip" hidden></span>
        <span class="spacer"></span>
        <span class="muted" id="counter">0자</span>
        <button type="button" class="ghost" id="clear">지우기</button>
      </div>
    </section>

    <section class="outputs" id="outputs"></section>
  </main>

  <div class="overlay" id="login" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <h1 id="login-title">ChatGPT 계정으로 로그인</h1>
      <p class="muted" id="login-desc">번역은 로그인한 ChatGPT 구독(Codex 포함 플랜)의 사용량으로 처리됩니다.</p>
      <div class="actions" id="login-actions">
        <button type="button" class="primary" id="login-browser">브라우저로 로그인</button>
        <button type="button" class="ghost" id="login-device">기기 코드로 로그인</button>
      </div>
      <div class="device" id="device-box" hidden>
        <p>아래 주소에서 코드를 입력하세요.</p>
        <a id="device-url" target="_blank" rel="noopener"></a>
        <code id="device-code"></code>
      </div>
      <p class="notice" id="login-msg" hidden></p>
    </div>
  </div>

  <template id="output-template">
    <article class="pane out-pane">
      <div class="pane-head">
        <span class="pane-title"></span>
        <button type="button" class="copy">복사</button>
      </div>
      <div class="output"></div>
      <div class="back-head"><span>한국어 확인 번역</span><button type="button" class="copy-back">복사</button></div>
      <div class="back-output" lang="ko" aria-live="polite"></div>
      <div class="pane-foot"><span class="muted meta"></span></div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
